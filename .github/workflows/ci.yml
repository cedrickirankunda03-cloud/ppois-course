name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-test-lint:
    name: Build, Test, Coverage, Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck

      - name: Configure CMake
        run: cmake -B build -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check coverage (>=90%)
        run: |
          cd build
          gcovr --root .. --filter "../src/" --exclude "../src/main.cpp" \
                --merge-mode-functions=merge-use-line-min \
                --fail-under-line 90
          gcovr --root .. --filter "../src/" --exclude "../src/main.cpp" \
                --merge-mode-functions=merge-use-line-min \
                --html-details coverage.html

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance --error-exitcode=1 \
                   --suppress=missingIncludeSystem \
                   --std=c++17 -I include src/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lab2/build/coverage.html

  release:
    name: Build Release Artifact
    if: github.event_name == 'release'
    needs: build-test-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Build release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package artifact
        run: |
          mkdir -p release
          cp build/dean_office_app release/
          tar -czf ../lab2-release-${{ github.ref_name }}-linux.tar.gz -C release .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: lab2/lab2-release-${{ github.ref_name }}-linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}