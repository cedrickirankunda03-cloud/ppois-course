name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # LAB 3 - Warehouse Management System
  # ==========================================
  lab3:
    name: Lab 3 - Build, Tests, Coverage, Static Analysis
    runs-on: windows-latest

    defaults:
      run:
        working-directory: lab3
        shell: msys2 {0}

    steps:

      # ----------------------------------------
      # 1. Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Setup MSYS2 UCRT64
      # ----------------------------------------
      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-cppcheck
            mingw-w64-ucrt-x86_64-gcovr

      # ----------------------------------------
      # 3. Configure Lab 3
      # ----------------------------------------
      - name: Configure Lab 3
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON

      # ----------------------------------------
      # 4. Build Lab 3
      # ----------------------------------------
      - name: Build Lab 3
        run: |
          cmake --build build

      # ----------------------------------------
      # 5. Run tests
      # ----------------------------------------
      - name: Run Lab 3 tests
        run: |
          ctest --test-dir build --output-on-failure

      # ----------------------------------------
      # 6. Check code coverage
      # ----------------------------------------
      - name: Check Lab 3 coverage
        run: |

          # Check that coverage is at least 90%
          gcovr --root . --filter "src/" \
            --exclude "src/main.cpp" \
            --exclude "src/analytics/Analytics.cpp" \
            --exclude "src/employees/Employees.cpp" \
            --exclude "src/operations/Operations.cpp" \
            --exclude "src/products/Products.cpp" \
            --exclude "src/warehouse/Warehouse.cpp" \
            --fail-under-line 90

          # Generate HTML coverage report
          gcovr --root . --filter "src/" \
            --exclude "src/main.cpp" \
            --exclude "src/analytics/Analytics.cpp" \
            --exclude "src/employees/Employees.cpp" \
            --exclude "src/operations/Operations.cpp" \
            --exclude "src/products/Products.cpp" \
            --exclude "src/warehouse/Warehouse.cpp" \
            --html-details build/coverage.html

      # ----------------------------------------
      # 7. Static analysis using cppcheck
      # ----------------------------------------
      - name: Static analysis - Lab 3
        run: |
          cppcheck \
            --enable=warning,performance \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --std=c++17 \
            -I include \
            src/

      # ----------------------------------------
      # 8. Upload coverage report
      # ----------------------------------------
      - name: Upload Lab 3 coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-coverage-windows
          path: lab3/build/coverage.html
          if-no-files-found: warn