
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Dictionary
        run: cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Release

      - name: Build Dictionary
        run: cmake --build build/Dictionary --config Release

      - name: Copy Dictionary test data
        shell: pwsh
        run: |
          if (Test-Path lab1/Dictionary/dictionary.txt) {
            Copy-Item lab1/Dictionary/dictionary.txt build/Dictionary/dictionary.txt -Force
          }

      - name: Test Dictionary
        run: ctest --test-dir build/Dictionary -C Release --output-on-failure

      - name: Configure Set
        run: cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Release

      - name: Build Set
        run: cmake --build build/Set --config Release

      - name: Test Set
        run: ctest --test-dir build/Set -C Release --output-on-failure

  coverage:
    name: Code coverage
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenCppCoverage
        shell: pwsh
        run: |
          choco install opencppcoverage --no-progress -y

          $coverageExe = Get-Command OpenCppCoverage.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty Source

          if (-not $coverageExe) {
            $possiblePaths = @(
              "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe",
              "C:\Program Files (x86)\OpenCppCoverage\OpenCppCoverage.exe",
              "C:\ProgramData\chocolatey\bin\OpenCppCoverage.exe"
            )

            foreach ($path in $possiblePaths) {
              if (Test-Path $path) {
                $coverageExe = $path
                break
              }
            }
          }

          if (-not $coverageExe) {
            $coverageExe = Get-ChildItem "C:\Program Files" `
              -Filter "OpenCppCoverage.exe" -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $coverageExe) {
            throw "OpenCppCoverage.exe was not found."
          }

          "OPENCPPCOVERAGE_EXE=$coverageExe" >> $env:GITHUB_ENV
          Write-Host "Coverage tool found: $coverageExe"

      - name: Configure and build Dictionary for coverage
        run: |
          cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/Dictionary --config Debug

      - name: Configure and build Set for coverage
        run: |
          cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/Set --config Debug

      - name: Generate Dictionary coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage/Dictionary | Out-Null

          if (Test-Path lab1/Dictionary/dictionary.txt) {
            Copy-Item lab1/Dictionary/dictionary.txt build/Dictionary/dictionary.txt -Force
          }

          $test = Get-ChildItem build/Dictionary -Filter "*Tests.exe" -Recurse |
            Select-Object -First 1

          if (-not $test) {
            throw "Dictionary test executable was not found."
          }

          & $env:OPENCPPCOVERAGE_EXE `
            --sources "$env:GITHUB_WORKSPACE\lab1\Dictionary" `
            --working_dir "$env:GITHUB_WORKSPACE\lab1\Dictionary" `
            --export_type "html:$env:GITHUB_WORKSPACE\coverage\Dictionary" `
            -- $test.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Dictionary coverage generation failed."
          }

      - name: Generate Set coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage/Set | Out-Null

          $test = Get-ChildItem build/Set -Filter "*Tests.exe" -Recurse |
            Select-Object -First 1

          if (-not $test) {
            throw "Set test executable was not found."
          }

          & $env:OPENCPPCOVERAGE_EXE `
            --sources "$env:GITHUB_WORKSPACE\lab1\Set" `
            --working_dir "$env:GITHUB_WORKSPACE\lab1\Set" `
            --export_type "html:$env:GITHUB_WORKSPACE\coverage\Set" `
            -- $test.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Set coverage generation failed."
          }

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab1-coverage-reports
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Check Dictionary and Set
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --language=c++ \
            lab1/Dictionary lab1/Set

  documentation:
    name: Generate Doxygen documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Dictionary documentation
        working-directory: lab1/Dictionary
        run: doxygen Doxyfile

      - name: Generate Set documentation
        working-directory: lab1/Set
        run: doxygen Doxyfile

      - name: Prepare website
        run: |
          mkdir -p _site/dictionary _site/set

          cp -r lab1/Dictionary/docs/html/. _site/dictionary/
          cp -r lab1/Set/docs/html/. _site/set/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Lab 1 Documentation</title>
          </head>
          <body>
            <h1>Lab 1 - Documentation</h1>
            <ul>
              <li><a href="dictionary/index.html">Dictionary Documentation</a></li>
              <li><a href="set/index.html">Unordered Cantor Set Documentation</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-docs:
    name: Deploy documentation website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  release:
    name: Package and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - coverage
      - lint
      - documentation
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Dictionary
        run: |
          cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Dictionary --config Release

      - name: Build Set
        run: |
          cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Set --config Release

      - name: Prepare release package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/package/Dictionary | Out-Null
          New-Item -ItemType Directory -Force release/package/Set | Out-Null
          New-Item -ItemType Directory -Force release/package/bin/Dictionary | Out-Null
          New-Item -ItemType Directory -Force release/package/bin/Set | Out-Null

          Copy-Item lab1/Dictionary/* release/package/Dictionary/ -Recurse -Force
          Copy-Item lab1/Set/* release/package/Set/ -Recurse -Force

          $dictionaryExe = Get-ChildItem build/Dictionary -Filter "*.exe" -Recurse
          $setExe = Get-ChildItem build/Set -Filter "*.exe" -Recurse

          if (-not $dictionaryExe) {
            throw "No Dictionary executables were found."
          }

          if (-not $setExe) {
            throw "No Set executables were found."
          }

          foreach ($file in $dictionaryExe) {
            Copy-Item $file.FullName release/package/bin/Dictionary/ -Force
          }

          foreach ($file in $setExe) {
            Copy-Item $file.FullName release/package/bin/Set/ -Force
          }

          @"
          Lab 1 - Design of Intelligent Systems Software

          Contents:
          - Dictionary source code and project files
          - Unordered Cantor Set source code and project files
          - Compiled Windows executables in bin/
          "@ | Set-Content release/package/README.txt

      - name: Create ZIP and SHA256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null

          Compress-Archive `
            -Path release/package/* `
            -DestinationPath release/lab1-windows.zip `
            -Force

          $hash = (Get-FileHash release/lab1-windows.zip -Algorithm SHA256).Hash
          "$hash  lab1-windows.zip" |
            Set-Content release/lab1-windows.zip.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/lab1-windows.zip
            release/lab1-windows.zip.sha256
