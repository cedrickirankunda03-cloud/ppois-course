
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Dictionary
        run: cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Release

      - name: Build Dictionary
        run: cmake --build build/Dictionary --config Release

      - name: Test Dictionary
        run: ctest --test-dir build/Dictionary -C Release --output-on-failure

      - name: Configure Set
        run: cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Release

      - name: Build Set
        run: cmake --build build/Set --config Release

      - name: Test Set
        run: ctest --test-dir build/Set -C Release --output-on-failure

  lint:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --language=c++ \
            lab1/Dictionary lab1/Set

  documentation:
    name: Generate Doxygen documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Dictionary documentation
        working-directory: lab1/Dictionary
        run: doxygen Doxyfile

      - name: Generate Set documentation
        working-directory: lab1/Set
        run: doxygen Doxyfile

      - name: Assemble documentation website
        shell: bash
        run: |
          mkdir -p _site/dictionary _site/set

          cp -a lab1/Dictionary/docs/html/. _site/dictionary/
          cp -a lab1/Set/docs/html/. _site/set/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Lab 1 Documentation</title>
          </head>
          <body>
            <h1>Lab 1 Documentation</h1>
            <h2>Projects</h2>
            <ul>
              <li><a href="dictionary/index.html">English-Russian Dictionary</a></li>
              <li><a href="set/index.html">Unordered Cantor Set</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-docs:
    name: Publish documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
