
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Dictionary
        run: cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Release

      - name: Build Dictionary
        run: cmake --build build/Dictionary --config Release

      - name: Test Dictionary
        run: ctest --test-dir build/Dictionary -C Release --output-on-failure

      - name: Configure Set
        run: cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Release

      - name: Build Set
        run: cmake --build build/Set --config Release

      - name: Test Set
        run: ctest --test-dir build/Set -C Release --output-on-failure

  coverage:
    name: Code coverage
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage --no-progress -y

      - name: Configure and build Dictionary
        run: |
          cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Dictionary --config Release

      - name: Configure and build Set
        run: |
          cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Set --config Release

      - name: Measure Dictionary coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage/Dictionary | Out-Null
          $test = Get-ChildItem build/Dictionary -Recurse -Filter '*Tests.exe' |
            Select-Object -First 1
          if (-not $test) {
            throw "Dictionary test executable was not found."
          }
          OpenCppCoverage.exe `
            --sources "$env:GITHUB_WORKSPACE\lab1\Dictionary" `
            --export_type "html:coverage/Dictionary" `
            -- $test.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Dictionary coverage measurement failed."
          }

      - name: Measure Set coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage/Set | Out-Null
          $test = Get-ChildItem build/Set -Recurse -Filter '*Tests.exe' |
            Select-Object -First 1
          if (-not $test) {
            throw "Set test executable was not found."
          }
          OpenCppCoverage.exe `
            --sources "$env:GITHUB_WORKSPACE\lab1\Set" `
            --export_type "html:coverage/Set" `
            -- $test.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Set coverage measurement failed."
          }

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: lab1-coverage-reports
          path: coverage/
          if-no-files-found: error

  lint:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run Cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 \
            --language=c++ \
            lab1/Dictionary lab1/Set

  documentation:
    name: Generate Doxygen documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Dictionary documentation
        working-directory: lab1/Dictionary
        run: doxygen Doxyfile

      - name: Generate Set documentation
        working-directory: lab1/Set
        run: doxygen Doxyfile

      - name: Assemble documentation website
        shell: bash
        run: |
          mkdir -p _site/dictionary _site/set

          cp -a lab1/Dictionary/docs/html/. _site/dictionary/
          cp -a lab1/Set/docs/html/. _site/set/

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Lab 1 Documentation</title>
          </head>
          <body>
            <h1>Lab 1 Documentation</h1>
            <ul>
              <li><a href="dictionary/index.html">English-Russian Dictionary</a></li>
              <li><a href="set/index.html">Unordered Cantor Set</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-docs:
    name: Publish documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create Lab 1 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coverage, lint, documentation]
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build Dictionary
        run: |
          cmake -S lab1/Dictionary -B build/Dictionary -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Dictionary --config Release

      - name: Configure and build Set
        run: |
          cmake -S lab1/Set -B build/Set -DCMAKE_BUILD_TYPE=Release
          cmake --build build/Set --config Release

      - name: Package Lab 1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/package/bin/Dictionary | Out-Null
          New-Item -ItemType Directory -Force release/package/bin/Set | Out-Null

          Copy-Item lab1/Dictionary release/package/Dictionary -Recurse
          Copy-Item lab1/Set release/package/Set -Recurse

          $dictExe = Get-ChildItem build/Dictionary -Recurse -Filter '*.exe' |
            Where-Object { $_.FullName -match '\\Release\\' }
          $setExe = Get-ChildItem build/Set -Recurse -Filter '*.exe' |
            Where-Object { $_.FullName -match '\\Release\\' }

          if (-not $dictExe) {
            throw "No Dictionary executable was found."
          }
          if (-not $setExe) {
            throw "No Set executable was found."
          }

          $dictExe | Copy-Item -Destination release/package/bin/Dictionary
          $setExe | Copy-Item -Destination release/package/bin/Set

          Compress-Archive -Path release/package/* `
            -DestinationPath release/lab1-windows.zip -Force

          $hash = (Get-FileHash release/lab1-windows.zip -Algorithm SHA256).Hash
          Set-Content release/SHA256.txt "$hash  lab1-windows.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lab 1 - Dictionary and Unordered Cantor Set
          generate_release_notes: true
          files: |
            release/lab1-windows.zip
            release/SHA256.txt
