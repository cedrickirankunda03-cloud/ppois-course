name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S lab1/Dictionary -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: cppcheck --enable=warning,performance,portability --inline-suppr --suppress=missingIncludeSystem lab1/Dictionary lab1/Set || true

  release:
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S lab1/Dictionary -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build release artifact
        run: cmake --build build --config Release

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Include *.exe | Copy-Item -Destination dist -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath dist\lab1-windows.zip -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lab1-windows.zip
